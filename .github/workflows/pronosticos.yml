# Publica cada hora los pronósticos de Open-Meteo en la rama "datos" (la app los lee desde ahí,
# porque la IP compartida de Streamlit Community Cloud suele tener agotada la cuota de Open-Meteo).
# La rama se reescribe en cada corrida (sin historial), así el repo no crece.
name: Actualizar pronósticos

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pronosticos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Mantener despierta la app (evita el modo dormido de Streamlit Cloud)
        run: curl -s -o /dev/null --max-time 60 https://metgeo-valparaiso.streamlit.app/ || true

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pandas numpy requests pyarrow

      - run: python actualiza_pronosticos.py salida

      - name: Publicar en la rama datos
        working-directory: salida
        run: |
          git init -q -b datos
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Pronósticos $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" datos
